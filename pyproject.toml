[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "day4-ticket-dashboard"
version = "0.4.0"
description = "Day 4: a Streamlit ticket-data dashboard on top of the Day 3 processing pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.40",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-randomly>=3.15",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "ruff>=0.5",
]

[project.scripts]
ticket-pipeline = "ticket_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ticket_pipeline = ["py.typed"]
ticket_dashboard = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: runs the whole pipeline or CLI against real files",
    "ui: drives the Streamlit app headlessly with streamlit.testing.AppTest",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["ticket_pipeline", "ticket_dashboard"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if __name__ == .__main__.:"]

[tool.mypy]
strict = true
files = ["src", "tests", "app.py"]
mypy_path = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE", "PT", "RET"]
